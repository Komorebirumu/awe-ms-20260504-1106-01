<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .background { fill: #F8F8F8; }
    .primary-color { fill: #4CAF50; } /* Green - AI/Growth */
    .secondary-color { fill: #2196F3; } /* Blue - Logic/Data */
    .accent-color { fill: #FFC107; } /* Yellow - Creativity/Art */
    .text-color { fill: #333333; }
    .icon-fill { fill: #FFFFFF; }
    .outline { stroke: #DDDDDD; stroke-width: 2; }
    .shadow { fill: rgba(0, 0, 0, 0.1); }
  </style>

  <!-- Background -->
  <rect width="800" height="600" class="background"/>

  <!-- Abstract Art Element - Central Focus -->
  <g transform="translate(400, 300)">
    <path d="M -80 -40 L 0 -120 L 80 -40 L 160 0 L 80 40 L 0 120 L -80 40 L -160 0 Z" class="primary-color" opacity="0.8"/>
    <circle cx="0" cy="0" r="40" class="accent-color" opacity="0.9"/>
    <path d="M -60 -30 Q 0 -90 60 -30 T 0 90 Z" class="secondary-color" opacity="0.7"/>
    <circle cx="40" cy="30" r="15" class="accent-color" opacity="0.9"/>
    <circle cx="-40" cy="30" r="15" class="accent-color" opacity="0.9"/>
    <circle cx="0" cy="-60" r="10" class="secondary-color" opacity="0.9"/>
  </g>

  <!-- AI Icon - Representing Intelligence/Generation -->
  <g transform="translate(100, 150)">
    <path d="M 40 0 C 40 15.64 27.64 30 15 30 C -7.64 30 -20 15.64 -20 0 C -20 -15.64 -7.64 -30 15 -30 C 27.64 -30 40 -15.64 40 0 Z" class="secondary-color"/>
    <circle cx="15" cy="0" r="10" class="icon-fill"/>
    <path d="M 15 15 L 15 25 M 15 -15 L 15 -25 M 0 0 L 10 0 M -10 0 L 0 0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Niche Icon - Representing Interior Decor -->
  <g transform="translate(700, 150)">
    <path d="M 0 -40 L 40 -40 L 40 40 L -40 40 L -40 -40 L 0 -40 Z" class="accent-color" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M -20 -20 L 20 -20 L 20 20 L -20 20 Z" class="primary-color" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" class="secondary-color"/>
  </g>

  <!-- Text Elements -->
  <text x="400" y="50" class="text-color" font-family="Arial, sans-serif" font-size="30" text-anchor="middle" font-weight="bold">AI-Driven Niche Procedural Abstract Art Generator</text>
  <text x="400" y="90" class="text-color" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">for Interior Decor</text>

  <!-- Decorative Geometric Shapes -->
  <polygon points="50,500 100,550 150,500" class="primary-color"/>
  <rect x="600" y="480" width="50" height="50" rx="10" class="secondary-color"/>
  <circle cx="200" cy="520" r="20" class="accent-color"/>
  <circle cx="550" cy="450" r="15" class="primary-color"/>

</svg>